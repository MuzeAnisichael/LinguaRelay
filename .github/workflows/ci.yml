name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,audio,asr,translation]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m pip check
      - run: lingua-relay languages
      - run: lingua-relay doctor --config config.example.toml
