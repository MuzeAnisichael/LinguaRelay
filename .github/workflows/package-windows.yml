name: Windows package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: python -m venv .release-venv
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - run: ./.release-venv/Scripts/python scripts/generate_sbom.py --bundle dist/LinguaRelay --output build/LinguaRelay.spdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: LinguaRelay-windows-x64
          path: |
            dist/LinguaRelay
            build/bundle-self-test.json
            build/LinguaRelay.spdx.json
          if-no-files-found: error
