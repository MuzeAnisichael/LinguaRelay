name: Translation quality or performance / 质量与性能
description: Report recognition, translation, latency, stability, or resource-use regressions.
title: "[Quality]: "
labels:
  - performance
body:
  - type: markdown
    attributes:
      value: |
        Measurements are most useful when the language route, hardware, model profile, and test conditions are included. Use a short synthetic or consented excerpt; never upload a private conversation.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Recognition accuracy
        - Fast-translation quality
        - LLM-revision quality
        - First-caption latency
        - Sustained latency or backlog
        - CPU, GPU, or memory use
        - Audio/device stability
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: Language route
      placeholder: Korean → English
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Version, profile, and hardware
      description: Give the exact release or source commit SHA if known, ASR/MT models, compute type and relevant hardware; the same source version may span different snapshots.
      placeholder: v0.3.2, Small, M2M100-418M, Core i7, 16 GB RAM, CPU INT8
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Minimal sanitized example
      description: Include the expected source text, recognized text, fast translation, and revised translation when available.
      placeholder: |
        Expected source:
        Recognized source:
        Fast translation:
        LLM revision:
    validations:
      required: true

  - type: textarea
    id: measurements
    attributes:
      label: Measurements and test conditions
      description: Include source (system/process/microphone/import), duration, noise and percentiles when relevant. Specify whether timing is audio-to-visible-caption, model-only, API response, or offline processing. Separate actual results from estimates.
      placeholder: First visible caption approximately 1.1 s; backlog started after 18 min...

  - type: input
    id: tracking
    attributes:
      label: Related requirement or ledger ID (optional)
      description: Add R-... or K-.../H-... if known; no ID is required to report a new problem.
      placeholder: R-QUALITY-01 / K-002

  - type: textarea
    id: notes
    attributes:
      label: Additional context

  - type: checkboxes
    id: consent
    attributes:
      label: Data checklist
      options:
        - label: This report contains only synthetic, public, or consented content.
          required: true
        - label: I removed names, secrets, private recordings, and unredacted history.
          required: true
