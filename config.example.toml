[app]
source_language = "en"
target_language = "zh"
history_enabled = true
history_path = "data/history.jsonl"

[overlay]
width = 920
bottom_margin = 96
opacity = 0.92
click_through = false

[audio]
backend = "wasapi"
device = "default"
sample_rate = 16000
chunk_ms = 320
raw_frame_ms = 20
buffer_seconds = 4.0
device_poll_seconds = 2.0
reconnect_initial_seconds = 0.5
reconnect_max_seconds = 5.0
silence_dbfs = -55.0
save_audio = false

[asr]
provider = "faster_whisper"
model = "small"
revision = "" # built-in base/small pins are used when empty
device = "auto" # auto | cuda | cpu
compute_type = "auto" # auto picks float16 on CUDA and int8 on CPU
beam_size = 1
vad_enabled = true
vad_threshold = 0.5
min_speech_ms = 320
min_silence_ms = 640
partial_interval_ms = 320
max_window_seconds = 24.0
max_segment_seconds = 24.0
inference_queue_capacity = 4
event_queue_capacity = 16

[translation]
provider = "route_registry"
model = "auto"

[correction]
mode = "off" # off | asynchronous | live
provider = "none"
model = ""
context_segments = 6
timeout_seconds = 8.0
