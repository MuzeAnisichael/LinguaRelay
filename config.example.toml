[app]
source_language = "en"
target_language = "zh-CN"
history_enabled = true
history_path = "data/history.jsonl"

[overlay]
width = 920
bottom_margin = 96
opacity = 0.92
click_through = false

[audio]
backend = "wasapi"
device = "default"
sample_rate = 16000
chunk_ms = 320
save_audio = false

[asr]
provider = "faster_whisper"
model = "small"
device = "cpu"
compute_type = "int8"
beam_size = 1
vad_enabled = true

[translation]
provider = "opus_mt"
model = "Helsinki-NLP/opus-mt-en-zh"

[correction]
mode = "off" # off | asynchronous | live
provider = "none"
model = ""
context_segments = 6
timeout_seconds = 8.0

