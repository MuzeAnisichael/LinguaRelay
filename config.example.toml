[app]
source_language = "en"
target_language = "zh"
history_enabled = true
history_path = "data/history.jsonl"

[overlay]
width = 920
height = 180
bottom_margin = 96
opacity = 0.92
click_through = false
display_mode = "bilingual" # bilingual | translated
position = "bottom" # bottom | top
source_font_size = 12
translation_font_size = 18
toggle_shortcut = "Ctrl+Alt+L"

[audio]
backend = "wasapi"
device = "default"
sample_rate = 16000
chunk_ms = 320
raw_frame_ms = 20
buffer_seconds = 4.0
device_poll_seconds = 2.0
reconnect_initial_seconds = 0.5
reconnect_max_seconds = 5.0
silence_dbfs = -55.0
save_audio = false

[asr]
provider = "faster_whisper"
model = "small"
revision = "" # built-in base/small pins are used when empty
device = "auto" # auto | cuda | cpu
compute_type = "auto" # auto picks float16 on CUDA and int8 on CPU
beam_size = 1
vad_enabled = true
vad_threshold = 0.5
min_speech_ms = 320
min_silence_ms = 640
preferred_silence_ms = 320 # after the preferred duration, a short pause can end the segment
partial_interval_ms = 320
punctuation_boundary_enabled = true
punctuation_boundary_min_seconds = 1.2 # stable sentence punctuation ends the caption early
preferred_segment_seconds = 6.0
max_caption_seconds = 10.0 # applies to existing configs that still have a longer model window
max_window_seconds = 10.0
max_segment_seconds = 10.0
inference_queue_capacity = 4
event_queue_capacity = 16

[translation]
provider = "m2m100_ct2"
model = "facebook/m2m100_418M"
revision = "55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636"
model_path = "models/m2m100_418m_ct2"
device = "auto"
compute_type = "auto"
beam_size = 1
max_input_tokens = 256
max_decoding_length = 256
cache_size = 512
queue_capacity = 4
event_queue_capacity = 16
translate_partials = true

[correction]
mode = "off" # off | asynchronous | live
provider = "none" # none | local | openai_compatible
endpoint = "http://127.0.0.1:8080/v1"
api_key_env = "LINGUA_RELAY_API_KEY" # store the key in this environment variable
model = "" # required when provider is local or openai_compatible
glossary_path = "data/glossary.json"
context_segments = 6
timeout_seconds = 8.0
requests_per_minute = 30
queue_capacity = 8
event_queue_capacity = 16
failure_threshold = 3
recovery_seconds = 30.0
max_output_chars = 4000
max_tokens = 512
temperature = 0.1
