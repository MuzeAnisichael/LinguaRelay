[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lingua-relay"
version = "0.1.1"
description = "Low-latency Windows audio translation captions with optional LLM revision"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "MuzeAnisichael" }]
keywords = ["translation", "captions", "whisper", "wasapi", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
audio = [
  "numpy>=1.26,<3",
  "psutil>=6,<8",
  "PyAudioWPatch>=0.2.12.8,<0.3; platform_system == 'Windows'",
  "soxr>=1.1,<2",
]
asr = [
  "faster-whisper>=1.2.1,<2",
  "numpy>=1.26,<3",
  "opencc-python-reimplemented>=0.1.7,<1",
  "psutil>=6,<8",
]
gpu = [
  "nvidia-cublas-cu12>=12.4,<13; platform_system == 'Windows'",
  "nvidia-cudnn-cu12>=9,<10; platform_system == 'Windows'",
]
benchmark = [
  "datasets>=4,<5",
  "sacrebleu>=2.5,<3",
]
translation = [
  "ctranslate2>=4.8,<5",
  "sentencepiece>=0.2,<1",
  "transformers>=4.48,<6",
]
packaging = [
  "pyinstaller>=6.18,<7",
]
runtime = [
  "ctranslate2>=4.8,<5",
  "faster-whisper>=1.2.1,<2",
  "numpy>=1.26,<3",
  "opencc-python-reimplemented>=0.1.7,<1",
  "psutil>=6,<8",
  "PyAudioWPatch>=0.2.12.8,<0.3; platform_system == 'Windows'",
  "soxr>=1.1,<2",
  "sentencepiece>=0.2,<1",
]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
lingua-relay = "lingua_relay.cli:main"

[project.urls]
Repository = "https://github.com/MuzeAnisichael/LinguaRelay"
Issues = "https://github.com/MuzeAnisichael/LinguaRelay/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lingua_relay"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
